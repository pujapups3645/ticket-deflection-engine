name: Enterprise GenAI RAG CI Pipeline

# Wakes up on push or PR to EITHER dev or main!
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyTest Suite
        run: |
          python -m pytest

      - name: Build Production Docker Image
        run: |
          docker build -t ticket-rag-service:latest .